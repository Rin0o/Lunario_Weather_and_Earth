name: Release

# Keeps a release PR open that bumps the version and CHANGELOG from Conventional Commits.
# Merging that PR tags vX.Y.Z and publishes a GitHub Release.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          # PRs opened with GITHUB_TOKEN do not trigger CI. Add a fine-grained PAT as
          # RELEASE_PLEASE_TOKEN so required checks run on the release PR (see CONTRIBUTING.md).
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
