name: Deploy

# Deploys to Cloudflare Pages only after CI has passed:
# - CI on main        -> production
# - CI on a PR branch -> preview URL (same-repository PRs only; forks never get secrets)
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.actor.login != 'dependabot[bot]' &&
      (github.event.workflow_run.event == 'pull_request' ||
       (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.workflow_run.head_branch == 'main' && 'production' || 'preview' }}
      url: ${{ steps.pages.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Validate branch name
        id: meta
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          if ! printf '%s' "$BRANCH" | grep -Eq '^[A-Za-z0-9._/-]+$'; then
            echo "Refusing to deploy unsafe branch name: $BRANCH"; exit 1
          fi
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
      # No wranglerVersion: the action uses the wrangler that npm ci installed, pinned in
      # package.json and the lockfile, so its peer dependencies always match.
      - id: pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=lunario --branch=${{ steps.meta.outputs.branch }} --commit-hash=${{ github.event.workflow_run.head_sha }}

  # Frost alerts Worker (D-33): production only, after the same green CI run.
  worker:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    environment:
      name: production-worker
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Check that the D1 database is configured
        id: ready
        run: |
          if grep -q '"database_id": "00000000-0000-0000-0000-000000000000"' worker/wrangler.jsonc; then
            echo "::notice::Worker not deployed: create the D1 database and set its id in worker/wrangler.jsonc (CONTRIBUTING.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.ready.outputs.ready == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: steps.ready.outputs.ready == 'true'
        run: npm ci
      - if: steps.ready.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: |
            d1 migrations apply lunario-alerts --remote
            deploy
