name: Deploy

# Deploys to Cloudflare Pages only after CI has passed:
# - CI on main        -> production
# - CI on a PR branch -> preview URL (same-repository PRs only; forks never get secrets)
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.actor.login != 'dependabot[bot]' &&
      (github.event.workflow_run.event == 'pull_request' ||
       (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.workflow_run.head_branch == 'main' && 'production' || 'preview' }}
      url: ${{ steps.pages.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Validate branch name
        id: meta
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          if ! printf '%s' "$BRANCH" | grep -Eq '^[A-Za-z0-9._/-]+$'; then
            echo "Refusing to deploy unsafe branch name: $BRANCH"; exit 1
          fi
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
      - id: pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.162.0'
          command: pages deploy dist --project-name=lunario --branch=${{ steps.meta.outputs.branch }} --commit-hash=${{ github.event.workflow_run.head_sha }}
