name: Bug report
description: Something is wrong or broken
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: And what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the app offline
        2. …
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: e.g. Android 15, Chrome 142, installed PWA
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown in the app footer.
